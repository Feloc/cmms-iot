services:
  db:
    image: timescale/timescaledb:2.17.2-pg15
    container_name: cmms_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: cmms_mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf

  ingest:
    build:
      context: .
      dockerfile: apps/ingest/Dockerfile
      target: dev
    container_name: cmms_ingest
    env_file:
      - .env
      - ./apps/ingest/.env
    depends_on:
      db: {condition: service_healthy}
      mosquitto: {condition: service_started}
    working_dir: /app/apps/ingest
    volumes:
      - ./apps/ingest:/app/apps/ingest
      - ingest_node_modules:/app/node_modules
    command: sh -lc '[ -d /app/node_modules ] || npm ci --workspaces --include-workspace-root; npm run dev'

  api:
    build: ./apps/api
    container_name: cmms_api
    env_file: .env
    environment:
      # El acceso normal es same-origin a través de web; no depende del host.
      CORS_ORIGINS: ""
      PUBLIC_API_BASE_URL: "http://web:3000"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    volumes:
      - ./apps/api:/app
      - /app/node_modules
      - ./storage/attachments:/app/storage/attachments
      - ./data/uploads:/app/uploads
    command: sh -c "npx prisma generate && npx prisma db push --accept-data-loss && npm run start:dev"

  web:
    build: ./apps/web
    container_name: cmms_web
    environment:
      # NextAuth toma host/protocolo de cada solicitud (LAN, VPN o DNS).
      AUTH_TRUST_HOST: "true"
      # Anula cualquier valor antiguo cargado desde los env_file.
      NEXTAUTH_URL:
      # Para llamadas del servidor (dentro del contenedor web) al API
      API_INTERNAL_URL: "http://api:3001"
    env_file: 
      - .env
      - ./apps/web/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command: npm run dev

volumes:
  db_data:
  ingest_node_modules:
  web_node_modules:
